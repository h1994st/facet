<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-zh="角色 · facet">Cast · facet</title>
    <meta
      name="description"
      content="Duna, Dudu and Nangnang, facet's three cats: how to add them to a footer or an empty state, and how they stay clear of the text."
      data-zh="嘟娜、嘟嘟和囔囔，facet 的三只猫：怎样把它们放进页脚或空状态，以及它们怎样避开文字。"
    />
    <script src="site.js"></script>
    <link rel="stylesheet" href="dist/facet.css" />
    <link rel="stylesheet" href="dist/cast/cast-layered.css" />
    <link rel="stylesheet" href="site.css" />
    <script type="module" src="dist/js/facet.js"></script>
    <script type="module" src="footer-cats.js"></script>
    <style>
      main > header {
        width: min(60rem, 100% - 2rem);
        margin: var(--f-space-6) auto 0;
      }
      .cast {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--f-space-4);
        width: min(60rem, 100% - 2rem);
        margin: var(--f-space-6) auto;
      }
      .member {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .member .f-card__body {
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        gap: var(--f-space-3);
      }
      .member .cat {
        width: 150px;
      }
      .member h2,
      .member p {
        margin: 0;
      }
      .swatches,
      .member .f-segmented {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        justify-content: center;
      }
      .swatches span {
        width: 22px;
        height: 22px;
        border: 1px solid var(--f-line-2);
        border-radius: 7px;
        corner-shape: squircle;
      }
      .member .f-segmented {
        margin-top: auto;
        border-radius: var(--f-r-lg, 1.25rem);
      }
      @media (max-width: 860px) {
        .cast {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="f-prose">
        <p class="f-kicker">Red Dot Tracker</p>
        <h1 data-zh="猫咪们">Cast</h1>
        <p
          data-zh="嘟娜、嘟嘟和囔囔：同一个 SVG，按猫着色。点姿势按钮试试；切换主题看深色背景上的描边。"
        >
          Duna, Dudu and Nangnang: one SVG, colored per cat. Try the pose buttons, and switch themes
          to see the outline they get on dark backgrounds.
        </p>
      </header>
      <div class="cast" id="cast"></div>
    </main>

    <footer class="f-footer">
      <div class="f-footer__cats"></div>
      <span data-zh="© Duna Feline · example.com">© Duna Feline · example.com</span>
    </footer>

    <script type="module">
      import { createCat, POSES } from "./dist/cast/cast.js";

      const CAST = [
        {
          id: "duna",
          name: "Duna Feline",
          zh: "嘟娜·菲琳",
          en: "Gray tabby, amber eyes. The star, and the author of every sample on these pages.",
          zhText: "灰色虎斑，琥珀色眼睛。主角，这些页面上所有示例的作者。",
          colors: ["#9aa3ad", "#59626d", "#eceff2", "#e3a72f", "#e48b8b"],
          pose: "wave",
        },
        {
          id: "dudu",
          name: "Dudu",
          zh: "嘟嘟",
          en: "Solid gray, medium-long hair, green eyes. Duna’s co-author and chief table-clearer.",
          zhText: "纯灰色中长毛，绿眼睛。嘟娜的合著者，也是首席桌面清理员。",
          colors: ["#8c939c", "#8c939c", "#b9bfc6", "#8fc27a", "#c98a8f"],
          pose: "blink",
        },
        {
          id: "nangnang",
          name: "Nangnang",
          zh: "囔囔",
          en: "Brown tabby, medium-long hair. Duna’s other co-author and the official stamp-keeper.",
          zhText: "棕色虎斑中长毛。嘟娜的另一位合著者，负责盖章。",
          colors: ["#b48c5f", "#5a4230", "#f2e7d7", "#b9c25a", "#d98579"],
          pose: "sit",
        },
      ];

      const out = document.getElementById("cast");
      for (const c of CAST) {
        const m = document.createElement("article");
        m.className = "f-card f-card--text member";
        const cat = createCat(c.id, { pose: c.pose, label: "" });
        m.insertAdjacentHTML(
          "beforeend",
          `<div class="f-card__body">
             <h2 data-zh="${c.zh}">${c.name}</h2>
             <p data-zh="${c.zhText}">${c.en}</p>
             <div class="swatches">${c.colors.map((x) => `<span style="background:${x}" title="${x}"></span>`).join("")}</div>
             <div class="f-segmented" role="group" aria-label="Pose">${POSES.map((p) => `<button type="button" data-pose="${p}" aria-pressed="${p === c.pose}">${p}</button>`).join("")}</div>
           </div>`,
        );
        m.querySelector(".f-card__body").prepend(cat);
        m.querySelector(".f-segmented").addEventListener("click", (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          cat.pose(b.dataset.pose);
          for (const x of m.querySelectorAll(".f-segmented button"))
            x.setAttribute("aria-pressed", x === b);
        });
        out.append(m);
      }
    </script>
  </body>
</html>
