<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>facet · Layout · App</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="layout.css" />
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      /* The app owns the whole window below the mockup toolbar. */
      .app {
        position: fixed;
        inset: var(--mk-bar) 0 0 0;
        background: #0b0e19;
      }
      .game {
        position: relative;
        height: 100%;
        overflow: hidden;
        background: url(assets/board.jpg) center / cover;
        cursor: crosshair;
      }
      .gbar {
        position: absolute;
        top: 0.75rem;
        left: 50%;
        z-index: 2;
        display: flex;
        gap: 1.2rem;
        align-items: center;
        padding: 0.4rem 0.5rem 0.4rem 1rem;
        border: 1px solid rgb(255 255 255 / 0.12);
        border-radius: 999px;
        background: rgb(16 20 32 / 0.7);
        backdrop-filter: blur(12px);
        color: rgb(255 255 255 / 0.85);
        font: 500 0.85rem var(--mk-sans);
        white-space: nowrap;
        transform: translateX(-50%);
      }
      .gbar b {
        color: #fff;
        font-variant-numeric: tabular-nums;
      }
      .gbar button {
        padding: 0.3rem 0.8rem;
        border: 0;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.12);
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      .dot {
        position: absolute;
        left: 50%;
        top: 55%;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: oklch(0.72 0.12 15);
        box-shadow:
          0 0 0 6px oklch(0.72 0.12 15 / 0.25),
          0 0 30px oklch(0.72 0.12 15);
        translate: -50% -50%;
        transition:
          left 0.35s cubic-bezier(0.2, 0.8, 0.2, 1),
          top 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      /* Site chrome shrinks to one glass pill, in a corner the app doesn't use. */
      .appbar {
        position: fixed;
        left: 1rem;
        top: calc(var(--mk-bar) + 0.6rem);
        z-index: 30;
        display: flex;
        gap: 0.2rem;
        align-items: center;
        padding: 0.3rem;
        border: 1px solid rgb(255 255 255 / 0.12);
        border-radius: 999px;
        background: rgb(16 20 32 / 0.62);
        backdrop-filter: blur(16px) saturate(140%);
        box-shadow: 0 10px 30px -12px rgb(0 0 0 / 0.7);
        color: #fff;
        font-size: 0.85rem;
      }
      .appbar a,
      .appbar button {
        padding: 0.4rem 0.75rem;
        border: 0;
        border-radius: 999px;
        background: none;
        color: rgb(255 255 255 / 0.85);
        font: 500 0.85rem var(--mk-sans);
        text-decoration: none;
        cursor: pointer;
      }
      .appbar a:hover,
      .appbar button:hover {
        background: rgb(255 255 255 / 0.12);
      }
      .appbar b {
        padding: 0 0.6rem 0 0.3rem;
        font: 600 0.92rem var(--heading);
      }
      .appbar .sep {
        width: 1px;
        height: 1.1rem;
        background: rgb(255 255 255 / 0.2);
      }
      @media (max-width: 640px) {
        .gbar {
          top: auto;
          bottom: 0.75rem;
          gap: 0.8rem;
        }
      }
      .hint {
        position: fixed;
        right: 1rem;
        top: calc(var(--mk-bar) + 4rem);
        z-index: 30;
        max-width: 18rem;
        padding: 0.7rem 0.9rem;
        border: 1px solid rgb(255 255 255 / 0.12);
        border-radius: 16px;
        background: rgb(16 20 32 / 0.62);
        backdrop-filter: blur(16px);
        color: rgb(255 255 255 / 0.8);
        font-size: 0.8rem;
        line-height: 1.5;
      }
      /* Phones: no room to float over the app, so the site chrome becomes a slim bar above it. */
      @media (max-width: 640px) {
        .app {
          top: calc(var(--mk-bar) + 44px);
        }
        .appbar {
          top: var(--mk-bar);
          left: 0;
          right: 0;
          height: 44px;
          justify-content: space-between;
          padding: 0 0.4rem;
          border: 0;
          border-bottom: 1px solid rgb(255 255 255 / 0.1);
          border-radius: 0;
          box-shadow: none;
        }
        .appbar .sep {
          display: none;
        }
        .hint {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <!-- A tiny self-contained demo app: pounce on the red dot (you won't catch it). -->
      <div class="game" id="game">
        <div class="gbar">
          <span data-zh="客厅">Living room</span>
          <span><span data-zh="扑击">Pounces</span> <b id="pounces">0</b></span>
          <span><span data-zh="抓到">Caught</span> <b>0</b></span>
          <button id="reset" data-zh="重来">Reset</button>
        </div>
        <span class="dot" id="dot"></span>
      </div>
    </div>
    <div class="appbar">
      <a href="layouts.html" data-zh="← 返回">← Back</a>
      <span class="sep"></span>
      <b>Red Dot</b>
      <button id="fs" data-zh="全屏">Fullscreen</button>
    </div>
    <p
      class="hint"
      data-zh="应用版式：内容占满窗口，网站的导航缩成角落里的一个玻璃胶囊。适合：游戏、交互演示、工具。"
    >
      App layout: the content fills the window and the site's nav shrinks to one glass pill in a
      corner the app leaves free. For: games, interactive demos, tools.
    </p>

    <script type="module">
      // The dot drifts on its own, and darts away whenever the pointer comes close.
      const game = document.getElementById("game");
      const dot = document.getElementById("dot");
      const count = document.getElementById("pounces");
      let pounces = 0;
      const move = () => {
        dot.style.left = 8 + Math.random() * 84 + "%";
        dot.style.top = 18 + Math.random() * 70 + "%";
      };
      setInterval(move, 1600);
      game.addEventListener("pointermove", (e) => {
        const r = dot.getBoundingClientRect();
        if (Math.hypot(e.clientX - r.x - r.width / 2, e.clientY - r.y - r.height / 2) < 70) move();
      });
      game.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".gbar")) return;
        count.textContent = ++pounces;
        move();
      });
      document
        .getElementById("reset")
        .addEventListener("click", () => (count.textContent = pounces = 0));
      document
        .getElementById("fs")
        .addEventListener("click", () => document.getElementById("app").requestFullscreen?.());
    </script>
    <script type="module" src="base.js"></script>
  </body>
</html>
